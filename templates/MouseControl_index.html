<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Control</title>

<style>
  *{
    box-sizing: border-box;
  }
  html, body {
    overscroll-behavior-x: none;
    touch-action: manipulation; /*disable iphone to zoom in*/
    padding:0;
    margin: 0;
  }
  .green{
    background-color: #04AA6D;
  }
  .multi-buttons{
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
    gap: 5px;
  }
  .button{
    width: 50%;
    aspect-ratio: 2;
  }
  #touchpad{
    touch-action: none; /*browser never scrolls or zooms while using the touchpad*/
  }
</style></head>
<body>
  <h1>Control the Mouse</h1>

  <div><label>mouseStep:</label> <input type="text" id="IP" value="10" oninput="onScaleChange()"></div>
  <div><label>touchpadSensitivity:</label> <input type="text" id="sensitivity" value="1" oninput="onSensitivityChange()"></div>

  <div class="multi-buttons">
    <button class="button" onclick="moveMouse(100, 200)">Move to (100, 200)</button>
    <!-- <button onclick="getPosition()">Get Mouse Position</button> -->
    <button class="button" onclick="sendkey({k:'volumedown'})">SysVolDn</button>
    <button class="button" onclick="sendkey({k:'volumeup'})">SysVolUp</button>
  </div>

  <div class="multi-buttons">
    <button class="button" onclick="down()" >Down</button>
    <button class="button" onclick="up()" >Up</button>
  </div>
  <div class="multi-buttons">
    <button class="button" onclick="left()" >Letf</button>
    <button class="button" onclick="right()" >Right</button>
  </div>

  <div>
    <button onclick="clickMouse()" style="height:150px; width:100%; margin-bottom: 5px;">Click Mouse</button>
  </div>

  <!--
    border-style: outset;
    margin: 0;
    padding: 0;
    margin-bottom: 20px;
  -->

  <div class="multi-buttons">
    <!-- margin-bottom: 5px; width: 300px;  font-size:24px; -->
    <input type="text" id="text" style="" onblur="textOnBlur()" placeholder="  type"/>
    <button class="button green" onclick="sendkey({hk:['ctrl', 'v']})">paste</button>
    <button class="button green" onclick="sendkey({k:'enter'})">enter</button>
    <button class="button green" onclick="sendkey({hk:['ctrl', 'a', 'backspace']})">clearAll</button>
  </div>

  <div class="multi-buttons">
    <button class="button" onclick="sendkey({hk:['alt','left']})">Backpage</button>
    <button class="button" onclick="sendkey({k:'esc'})">ESC</button>
    <button class="button" onclick="sendkey({k:'f'})">FullSreen</button>
  </div>

  <div class="multi-buttons">
    <button class="button" onclick="sendkey({k:['left']})">&larr;</button>
    <button class="button" onclick="sendkey({k:['down']})">&darr;</button>
    <button class="button" onclick="sendkey({k:['up']})">&uarr;</button>
    <button class="button" onclick="sendkey({k:['right']})">&rarr;</button>
  </div>

  <canvas id="touchpad"style="border:solid black 1px; width: 100%; height: 80vh">
    Your browser does not support the canvas tag.
  </canvas>

  Log:
  <div>
    <pre id="log" style="border: 1px solid #ccc;"></pre>
  </div>
  <script>
    const TAP_MAX_MS = 250;   // a touch shorter than this...
    const TAP_MAX_MOVE = 10;  // ...that moved less than this (px) is a click
    var ws = null;             // touchpad websocket, falls back to HTTP while not open
    const lastPos = new Map(); // touch identifier -> {x, y} last seen
    var gesture = null;        // {start, fingers, moved} from first finger down to last finger up
    var accX = 0, accY = 0, accScroll = 0; // movement not sent yet
    var frameQueued = false, inFlight = false;
    var sensitivity = parseFloat(localStorage['sensitivity']) || 1;
    document.getElementById("sensitivity").value = sensitivity;
    function log(msg) {
        const container = document.getElementById("log");
        if(typeof msg === "object" && msg !== null){
            msg = JSON.stringify(msg, null, 2);
        }
        //container.textContent = `${msg} \n${container.textContent}`;
    }
    function up(){
        fetch(
            "http://".concat(window.location.host).concat("/up")
        )
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function down(){
        fetch(
            "http://".concat(window.location.host).concat("/down")
        )
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function left(){
        fetch(
            "http://".concat(window.location.host).concat("/left")
        )
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function right(){
        fetch(
            "http://".concat(window.location.host).concat("/right")
        )
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function onSensitivityChange(){
        const v = parseFloat(document.getElementById("sensitivity").value);
        if (v > 0) {
            sensitivity = v;
            localStorage['sensitivity'] = v;
        }
    }
    function onScaleChange(){
        fetch(
            "http://".concat(window.location.host).concat("/scale")
            , {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ s: document.getElementById("IP").value })
        })
        .then(response => response.json())
        .then(data => {
            log(data)
            document.getElementById("IP").value = data["scale"]
        });
    }
    function moveMouse(x, y) {
        fetch(
            // 'http://localhost:5000/move_mouse'
            "http://".concat(window.location.host).concat("/move_mouse")
            , {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ x: x, y: y })
        })
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function connectWs() {
        ws = new WebSocket("ws://".concat(window.location.host).concat("/ws"));
        ws.onopen = () => log("websocket connected");
        ws.onclose = () => {
            log("websocket closed, reconnect in 1s");
            setTimeout(connectWs, 1000);
        };
    }
    // touchpad events go over the websocket when connected, otherwise over HTTP
    function send(event, data, path) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({t: event, ...data}));
            return Promise.resolve();
        }
        return fetch(
            "http://".concat(window.location.host).concat(path)
            , {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function clickMouse(button = "left") {
        log(`clickMouse ${button}`)
        send("click", {button: button}, "/click_mouse");
    }
    function getPosition() {
        fetch( "http://".concat(window.location.host).concat("/get_position") )
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function sendkey(key){
        fetch(
            // 'http://localhost:5000/sendkey'
            "http://".concat(window.location.host).concat("/sendkey")
            , {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(key)
        })
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function textOnBlur() {
        const el = document.getElementById("text");
        fetch(
            // 'http://localhost:5000/sendtext'
            "http://".concat(window.location.host).concat("/sendtext")
            , {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({text:el.value})
        })
        .then(response => response.json()).then(data => log(data)).catch(error => log(error.message));
    }
    function queueFlush() {
      if (!frameQueued) {
        frameQueued = true;
        requestAnimationFrame(flush);
      }
    }
    // send what moved since last frame, at most once per frame
    function flush() {
      frameQueued = false;
      if (inFlight) return; // slow HTTP request still running, keep accumulating; it flushes when done
      const jobs = [];
      if (accX || accY) {
        jobs.push(send("move", {x: accX, y: accY}, "/move_mouse"));
        accX = accY = 0;
      }
      if (accScroll) {
        jobs.push(send("scroll", {y: accScroll}, "/scroll"));
        accScroll = 0;
      }
      if (jobs.length == 0) return;
      inFlight = true;
      Promise.all(jobs).finally(() => {
        inFlight = false;
        if (accX || accY || accScroll) queueFlush();
      });
    }
    function handleStart(evt) {
      evt.preventDefault();
      for (const t of evt.changedTouches) {
        lastPos.set(t.identifier, {x: t.clientX, y: t.clientY});
      }
      if (gesture == null) {
        gesture = {start: performance.now(), fingers: 0, moved: 0};
      }
      gesture.fingers = Math.max(gesture.fingers, evt.touches.length);
    }
    function handleMove(evt) {
      evt.preventDefault();
      let dx = 0, dy = 0;
      for (const t of evt.changedTouches) {
        const p = lastPos.get(t.identifier);
        if (p == undefined) continue;
        dx += t.clientX - p.x;
        dy += t.clientY - p.y;
        p.x = t.clientX;
        p.y = t.clientY;
      }
      if (gesture) gesture.moved += Math.abs(dx) + Math.abs(dy);

      if (evt.touches.length == 1 && gesture && gesture.fingers == 1) {
        // one finger: move mouse (not when a finger is left over from a two-finger scroll)
        accX += dx * sensitivity;
        accY += dy * sensitivity;
      } else if (evt.touches.length == 2) {
        // two fingers: scroll by the average of both fingers
        accScroll += dy / 2;
      }
      queueFlush();
    }
    function handleEnd(evt) {
      evt.preventDefault(); //prevent browser continuing to process the touch event
      for (const t of evt.changedTouches) {
        lastPos.delete(t.identifier);
      }
      if (evt.touches.length > 0 || gesture == null) return; // wait until all fingers are up

      const isTap = evt.type == "touchend"
        && performance.now() - gesture.start < TAP_MAX_MS
        && gesture.moved < TAP_MAX_MOVE;
      if (isTap) {
        flush(); // send any pending move before clicking
        clickMouse(gesture.fingers >= 2 ? "right" : "left");
      }
      gesture = null;
    }
    function startTouchDetec() {
      log(`Browser width: ${window.innerWidth}, height: ${window.innerHeight}`);
      //notebook screen size:(1522,792)
      const el = document.getElementById("touchpad");
      el.addEventListener("touchstart", handleStart, {passive: false});
      el.addEventListener("touchmove", handleMove, {passive: false});
      el.addEventListener("touchend", handleEnd, {passive: false});
      el.addEventListener("touchcancel", handleEnd, {passive: false});
    }

    //stop function define
    document.addEventListener("DOMContentLoaded", startTouchDetec);
    connectWs();
    </script>
</body>
</html>
